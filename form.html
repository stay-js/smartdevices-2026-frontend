<div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-lg border border-slate-100">
  <h2 class="text-2xl font-bold text-slate-800 mb-6">Új eszköz rögzítése</h2>
  <form class="grid grid-cols-1 gap-6">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Eszköz neve</label>
      <input type="text" id="name"
        class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Válasszon szobát</label>
      <select id="room_id"
        class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
      </select>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Márka</label>
        <input type="text" id="brand"
          class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Állapot</label>
        <select id="status"
          class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="Online">Online</option>
          <option value="Offline">Offline</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Teljesítmény (W)</label>
        <input type="number" id="energy_usage"
          class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Firmware verzió</label>
        <input type="text" id="firmware_version"
          class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div class="col-span-2">
        <label class="block text-sm font-medium text-slate-700 mb-1">Utolsó szinkronizáció</label>
        <input type="date" id="last_sync"
          class="w-full px-4 py-2 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
    </div>
    <button type="submit"
      class="w-full py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition-colors">
      Mentés
    </button>
  </form>
</div>
